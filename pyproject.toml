[project]
name = "karafun-intercept"
version = "0.1.0"
description = "A Textual TUI application."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "textual>=0.85",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.1",
]

[project.scripts]
karafun-intercept = "karafun_intercept.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karafun_intercept"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
